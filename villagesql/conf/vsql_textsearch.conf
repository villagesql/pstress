# vsql_textsearch bm25 index run: villagesql/vsql-loop.sh villagesql/conf/vsql_textsearch.conf
# Needs vsql_textsearch built with -DVTS_BUILD_EXTENSION=ON; its .veb comes
# from the server's veb_output_directory (make install) unless VEB_SRC_DIR
# names the extension's build directory.
# vsql_textsearch_dml: ranked reads (k 1/10/300/100000, WHERE filters,
# scores, body, FOR UPDATE/SHARE/SKIP LOCKED, derived tables and CTEs,
# prepared statements), inserts, text updates, NULLs, primary key updates,
# deletes, and p_tx_chk under load.
# vsql_textsearch_txn: transaction shapes (p_tx_txn), savepoints, XA,
# consistent snapshots, READ UNCOMMITTED, READ COMMITTED and REPEATABLE READ.
# Every table keeps the indexed text in txt too. p_tx_chk compares each
# ranked read with the rows whose txt contains a query word, read by REGEXP
# in the same snapshot or with the same lock, and checks order, duplicates
# and the text returned. Errors the extension logs are findings too.
# No SERIALIZABLE: its reads do not use the index scan, and bm25_distance
# then fails with error 3200. No CREATE INDEX on rows, ALTER TABLE or
# OPTIMIZE: the server cannot build a custom index over rows.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/textsearch}
GRAMMAR=${GRAMMAR:-vsql_textsearch_dml:10 vsql_textsearch_txn:4}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_textsearch_init.sql}
CHECK_SQL=${CHECK_SQL:-$SCRIPT_DIR/init/vsql_textsearch_check.sql}
VEB_FILES=${VEB_FILES:-vsql_textsearch.veb}
ERR_FAIL_PATTERN=${ERR_FAIL_PATTERN:-bm25:|text index storage}
# mysqld runs with --no-defaults, which skips SET PERSIST values on restart.
MYEXTRA="${MYEXTRA:-} --vsql-allow-preview-extensions=ON"
