# vsql_cube R-tree index run: villagesql/vsql-loop.sh villagesql/conf/vsql_cube.conf
# Needs vsql_cube built with -DVSQL_CUBE_RTREE=ON; set VEB_SRC_DIR to its build
# directory.
# vsql_cube_dml: KNN reads on every metric (k 1/10/300, WHERE filters, box
# query values, prepared statements, FOR UPDATE/SHARE, derived tables and
# CTEs), inserts, near and far moves, primary key updates, deletes, NULLs.
# vsql_cube_txn: transaction shapes (p_cb_txn), savepoints, XA, consistent
# snapshots, all isolation levels including READ UNCOMMITTED.
# The R-tree is exact: p_cb_chk compares each index scan with a full scan and
# any difference fails CHECK_SQL. Errors the extension logs ("cube rtree:")
# are findings too.
# No CREATE INDEX on rows, ALTER TABLE or OPTIMIZE: they crash in
# Btree_load::build today.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/cube}
GRAMMAR=${GRAMMAR:-vsql_cube_dml:10 vsql_cube_txn:4}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_cube_init.sql}
CHECK_SQL=${CHECK_SQL:-$SCRIPT_DIR/init/vsql_cube_check.sql}
VEB_FILES=${VEB_FILES:-vsql_cube.veb}
ERR_FAIL_PATTERN=${ERR_FAIL_PATTERN:-cube rtree:}
# mysqld runs with --no-defaults, which skips SET PERSIST values on restart.
MYEXTRA="${MYEXTRA:-} --vsql-allow-preview-extensions=ON"
