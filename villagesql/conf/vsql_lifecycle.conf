# Extension lifecycle run: villagesql/vsql-loop.sh villagesql/conf/vsql_lifecycle.conf
# pstress runs the vsql_complex workload as usual. Beside it, lifecycle workers
# create, use and drop vsql_simple and vsql_tvector objects and uninstall and
# install both extensions; vsql_complex UNINSTALL is always refused (its tables
# exist), so it exercises the dependency checks under load.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/lifecycle}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_complex_init.sql}
VEB_FILES=${VEB_FILES:-vsql_complex.veb vsql_simple.veb vsql_tvector.veb}
LIFECYCLE_GRAMMAR=${LIFECYCLE_GRAMMAR:-vsql_lifecycle}
