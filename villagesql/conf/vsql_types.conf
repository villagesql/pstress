# Custom type run: villagesql/vsql-loop.sh villagesql/conf/vsql_types.conf
# Only the random pstress workload runs, with --custom-types: random tables get
# COMPLEX, COMPLEX2, TVECTOR, BYTEARRAY, TARRAY, BITFIELD and STORED_INT
# columns, which DML, WHERE clauses and indexes use through the expressions in
# custom_types.json. STORED_INT is kept by the extension's column storage, a
# preview capability.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/types}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_types_init.sql}
VEB_FILES=${VEB_FILES:-vsql_complex.veb vsql_simple.veb vsql_tvector.veb vsql_tarray_test.veb vsql_bitfield_test.veb vsql_storage_test.veb}
MYEXTRA="${MYEXTRA:-} --vsql-allow-preview-extensions=ON"
GRAMMAR_WEIGHT=${GRAMMAR_WEIGHT:-0}
# CUSTOM_TYPES: another types file, e.g. one that leaves a type out
PSTRESS_EXTRA="${PSTRESS_EXTRA:-} --custom-types=${CUSTOM_TYPES:-$SCRIPT_DIR/custom_types.json}"
