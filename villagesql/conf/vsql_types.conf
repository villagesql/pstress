# Custom type run: villagesql/vsql-loop.sh villagesql/conf/vsql_types.conf
# Only the random pstress workload runs, with --custom-types: random tables get
# COMPLEX, COMPLEX2, TVECTOR and BYTEARRAY columns, which DML, WHERE clauses
# and indexes use through the expressions in custom_types.json.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/types}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_types_init.sql}
VEB_FILES=${VEB_FILES:-vsql_complex.veb vsql_simple.veb vsql_tvector.veb}
GRAMMAR_WEIGHT=${GRAMMAR_WEIGHT:-0}
PSTRESS_EXTRA="${PSTRESS_EXTRA:-} --custom-types=$SCRIPT_DIR/custom_types.json"
