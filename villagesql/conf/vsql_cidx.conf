# Custom index run: villagesql/vsql-loop.sh villagesql/conf/vsql_cidx.conf
# Custom indexes from three test extensions: vsql_knn_index_test (KVECTOR in
# column storage, brute-force KNN index), vsql_index_test (dummy index) and
# vsql_ext_index_test (index on a 12K externally stored type). pstress runs
# its random DML plus DML and KNN queries on the indexed tables and DDL that
# adds, drops and rebuilds the indexes; lifecycle workers uninstall and
# install the extensions meanwhile.
# vsql_cidx_nyi holds table rebuilds, index builds over existing rows and
# CHECK TABLE on a KNN table, which crash or corrupt the index today; add
# vsql_cidx_nyi:1 to GRAMMAR once they are implemented.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/cidx}
GRAMMAR=${GRAMMAR:-vsql_cidx_dml:10 vsql_cidx_ddl:1}
LIFECYCLE_GRAMMAR=${LIFECYCLE_GRAMMAR:-vsql_cidx_lifecycle}
LIFECYCLE_THREADS=${LIFECYCLE_THREADS:-2}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_cidx_init.sql}
VEB_FILES=${VEB_FILES:-vsql_knn_index_test.veb vsql_index_test.veb vsql_ext_index_test.veb}
# mysqld runs with --no-defaults, which skips SET PERSIST values on restart.
MYEXTRA="${MYEXTRA:-} --vsql-allow-preview-extensions=ON"
