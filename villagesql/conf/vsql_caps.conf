# Capability run: villagesql/vsql-loop.sh villagesql/conf/vsql_caps.conf
# Extensions whose code runs during other sessions' statements or in their own
# threads: a query hook (vsql_slow_query_log), a VDF with status counters
# (vsql_usage_counter), a listener thread (vsql_thread_worker_test), a monitor
# thread (vsql_lifecycle_test) and a reader of session state through MySQL
# services (vsql_mysql_services_session_test). pstress runs its random DML
# plus vsql_caps, which calls the extensions and toggles their variables;
# lifecycle workers uninstall and install the extensions meanwhile.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/caps}
GRAMMAR=${GRAMMAR:-vsql_caps}
LIFECYCLE_GRAMMAR=${LIFECYCLE_GRAMMAR:-vsql_caps_lifecycle}
LIFECYCLE_THREADS=${LIFECYCLE_THREADS:-3}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_caps_init.sql}
VEB_FILES=${VEB_FILES:-vsql_slow_query_log.veb vsql_usage_counter-0.0.1.veb vsql_thread_worker_test.veb vsql_lifecycle_test.veb vsql_mysql_services_session_test.veb}
MYEXTRA="${MYEXTRA:-} --vsql-allow-preview-extensions=ON"
