# vsql_vector (SVECTOR + HNSW) run: villagesql/vsql-loop.sh villagesql/conf/vsql_vector.conf
# vsql_vector_txn adds transactions, savepoints, XA, isolation levels, vector
# updates, batch deletes for purge, and KNN checks (vsql.p_vv_chk). CHECK_SQL
# runs KNN checks on the recovered indexes after every restart, fails on a row
# returned twice or rows out of distance order, and logs recall, short results
# and missed self matches as INFO.
# Known issues (knn_review/ISSUES.md): KNN-27 and KNN-29 lower recall; KNN-24
# makes locking KNN reads short, which are not checked; KNN-20 skips the drop
# callback on DROP and TRUNCATE of the HNSW tables in vsql_vector_ddl;
# vsql_vector_alter holds rebuilds, index builds over rows and CHECK TABLE
# (KNN-10, KNN-11/NYI-4).
# @vv_v gets no invalid vectors: a KNN prepared statement bound to one crashes
# the server (KNN-30). Bad literals stay in the INSERT lines.
# No primary key UPDATE on the HNSW tables: one that waits for a lock
# delete-marks the old vector twice (KNN-32).
# Add vsql_vector_alter:1 to GRAMMAR for ALTER TABLE, CREATE INDEX, OPTIMIZE
# and CHECK on HNSW tables, which crash the server today.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/vector}
GRAMMAR=${GRAMMAR:-vsql_vector_dml:10 vsql_vector_ddl:1 vsql_vector_txn:4}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_vector_init.sql}
CHECK_SQL=${CHECK_SQL:-$SCRIPT_DIR/init/vsql_vector_check.sql}
VEB_FILES=${VEB_FILES:-vsql_vector.veb}
# mysqld runs with --no-defaults, which skips SET PERSIST values on restart.
MYEXTRA="${MYEXTRA:-} --vsql-allow-preview-extensions=ON"
