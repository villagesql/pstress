# Extension version update run: villagesql/vsql-loop.sh villagesql/conf/vsql_update.conf
# pstress drives DML and DDL on objects of the update test extensions' types
# and queues ALTER EXTENSION ... VERSION ... AT RESTART to random versions,
# including ones the precheck must reject. The loop restarts the server every
# step, which applies the pending update during crash recovery; CHECK_SQL then
# verifies that every dependent points at the installed version.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/update}
GRAMMAR=${GRAMMAR:-vsql_update_dml:10 vsql_update_ddl:1 vsql_update_ext:1}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_update_init.sql}
CHECK_SQL=${CHECK_SQL:-$SCRIPT_DIR/init/vsql_update_check.sql}
VEB_FILES=${VEB_FILES:-update_test-1.0.0.veb update_test-1.1.0.veb update_test-1.2.0.veb update_test-2.0.0.veb update_schema_test-1.0.0.veb update_schema_test-2.0.0.veb update_length_test-1.0.0.veb update_length_test-1.1.0.veb update_length_test-1.2.0.veb update_length_test-1.3.0.veb update_length_test-1.4.0.veb}
STEP_SECONDS=${STEP_SECONDS:-30}
# mysqld runs with --no-defaults, which skips SET PERSIST values on restart.
MYEXTRA="${MYEXTRA:-} --vsql-allow-preview-extensions=ON"
