# Extension system variable run: villagesql/vsql-loop.sh villagesql/conf/vsql_sessvar.conf
# Long-lived pstress sessions set and read session, global and persisted
# variables of three extensions, including through VDFs, routines, a trigger
# and performance_schema views of every session's values. Lifecycle workers
# uninstall and reinstall the extensions and set values in sessions that then
# disconnect. mysqld reads mysqld-auto.cnf, so persisted values of possibly
# uninstalled extensions go through every restart.
RUNDIR=${RUNDIR:-$SCRIPT_DIR/../run/sessvar}
# vsql_sessvar_threads reads every session's variables through
# performance_schema.variables_by_thread. Debug builds assert in
# Sys_var_gtid_owned::session_value_ptr when another session's gtid_owned is
# read while it commits; leave it out there with GRAMMAR=vsql_sessvar.
GRAMMAR=${GRAMMAR:-vsql_sessvar vsql_sessvar_threads}
LIFECYCLE_GRAMMAR=${LIFECYCLE_GRAMMAR:-vsql_sessvar_lifecycle}
LIFECYCLE_THREADS=${LIFECYCLE_THREADS:-3}
INIT_SQL=${INIT_SQL:-$SCRIPT_DIR/init/vsql_sessvar_init.sql}
CHECK_SQL=${CHECK_SQL:-$SCRIPT_DIR/init/vsql_sessvar_check.sql}
VEB_FILES=${VEB_FILES:-vsql_session_var_test.veb vsql_config_vars_test.veb vsql_range_clamp_test.veb}
STEP_SECONDS=${STEP_SECONDS:-30}
MYSQLD_DEFAULTS=${MYSQLD_DEFAULTS:---defaults-file=/dev/null}
MYEXTRA="${MYEXTRA:-} --vsql-allow-preview-extensions=ON"
